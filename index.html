<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>MOF Physio - Clinic Management System</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- 1. Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        MOF Physio
      </div>

      <nav class="nav-links">
        <button
          id="navDashboard"
          class="nav-btn active"
          onclick="switchView('dashboard')"
        >
          <span class="icon">📊</span>
          Dashboard
        </button>
        <button
          id="navPatients"
          class="nav-btn"
          onclick="switchView('patients')"
        >
          <span class="icon">👥</span>
          Patients
        </button>
        <button id="navStaff" class="nav-btn" onclick="switchView('staff')">
          <span class="icon">🩺</span>
          Staff
        </button>
        <button class="nav-btn">
          <span class="icon">⚙️</span>
          Settings
        </button>
      </nav>
    </aside>

    <!-- 2. Main Content Area -->
    <main class="main-content">
      <!-- VIEW A: DASHBOARD / HOMEPAGE -->
      <section id="viewDashboard">
        <h1 class="header-title">Clinic Overview</h1>

        <!-- KPI Cards Grid -->
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Total Patients</span>
            <span class="stat-value" id="statPatientsCount"></span>
            <span class="stat-sub">Registered in database</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Active Therapists</span>
            <span class="stat-value" id="statStaffCount"></span>
            <span class="stat-sub">Physiotherapy staff</span>
          </div>
        </div>
      </section>

      <!-- VIEW B: PATIENTS MANAGEMENT -->
      <section id="viewPatients" style="display: none">
        <h1 class="header-title">Patients Management</h1>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search by patient name "
            oninput="searchPatients()"
          />
          <button class="primary-btn" onclick="searchPatients()">Search</button>
        </div>

        <!-- Button right corner -->
        <div
          style="display: flex; justify-content: flex-end; margin-bottom: 20px"
        >
          <button class="primary-btn" onclick="openPatientModal()">
            + Add New Patient
          </button>
        </div>

        <dialog
          id="patientDialog"
          style="
            border: none;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 90%;
            margin: auto;
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 16px;
            "
          >
            <h3 style="margin: 0; color: #1e293b; font-size: 18px">
              New Patient Card
            </h3>
            <button
              type="button"
              onclick="closePatientModal()"
              style="
                background: none;
                border: none;
                font-size: 20px;
                cursor: pointer;
                color: #64748b;
              "
            >
              ✕
            </button>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 12px;
              margin-bottom: 20px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label style="font-size: 13px; font-weight: 600; color: #475569">
                Full Name
              </label>
              <input
                type="text"
                id="patientName"
                placeholder="π.χ. Νίκος Παπαδόπουλος"
                style="
                  padding: 10px 12px;
                  border: 1px solid #cbd5e1;
                  border-radius: 6px;
                  font-size: 14px;
                "
              />
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px">
              <label style="font-size: 13px; font-weight: 600; color: #475569">
                Phone
              </label>
              <input
                type="text"
                id="patientPhone"
                placeholder="π.χ. 6912345678"
                style="
                  padding: 10px 12px;
                  border: 1px solid #cbd5e1;
                  border-radius: 6px;
                  font-size: 14px;
                "
              />
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px">
            <button
              type="button"
              onclick="closePatientModal()"
              style="
                background: #f1f5f9;
                border: 1px solid #cbd5e1;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
              "
            >
              Cancel
            </button>
            <button type="button" class="primary-btn" onclick="savePatient()">
              Save
            </button>
          </div>
        </dialog>

        <div id="patientsContainer" class="cards-container"></div>

        <dialog id="viewPatientDialog">
          <h3>Patient Card</h3>
          <button type="button" id="closeViewBtn">✕</button>

          <div>
            <p>
              <strong>ID:</strong>
              <span id="viewPatientId">-</span>
            </p>
            <p>
              <strong>Name:</strong>
              <span id="viewPatientName">-</span>
            </p>
            <p>
              <strong>Phone:</strong>
              <span id="viewPatientPhone">-</span>
            </p>
          </div>

          <h4>Visits History</h4>
          <div class="visit-form">
            <input type="date" id="visitDate" />
            <input type="text" id="visitDiagnosis" placeholder="Diagnosis" />
            <input type="text" id="visitNotes" placeholder="Notes" />
            <button type="button" id="addVisitBtn">Add visit</button>
          </div>
          <div id="visitsList"></div>

          <button type="button" id="editPatientBtn">Edit</button>
          <button type="button" id="deletePatientBtn">Delete</button>
        </dialog>

        <dialog id="editPatientDialog">
          <h3>Edit Patient</h3>
          <input type="hidden" id="editPatientId" />

          <div>
            <input type="text" id="editPatientName" placeholder="Full Name" />
            <span
              id="editNameError"
              style="color: #ef4444; font-size: 12px; display: none"
            ></span>
          </div>
          <div>
            <input type="text" id="editPatientPhone" placeholder="Phone" />
          </div>

          <div>
            <button type="button" id="saveEditBtn">Save Changes</button>
            <button type="button" id="cancelEditBtn">Cancel</button>
          </div>
        </dialog>
      </section>

      <!-- VIEW C: STAFF MANAGEMENT -->
      <section id="viewStaff" style="display: none">
        <h1 class="header-title">Staff Management</h1>
        <button class="primary-btn" onclick="openStaffModal()">
          Add Staff
        </button>
        <div id="staffContainer" class="cards-container"></div>
      </section>

      <dialog id="staffDialog" class="app-dialog">
        <h3>New Staff</h3>
        <input type="text" id="staffName" placeholder="Full Name" />
        <span
          id="staffNameError"
          style="color: #ef4444; font-size: 12px; display: none"
        ></span>
        <input type="text" id="staffSpecialty" placeholder="Specialty" />
        <input type="text" id="staffPhone" placeholder="Phone" />
        <button onclick="saveStaff()">Save</button>
        <button onclick="closeStaffModal()">Cancel</button>
      </dialog>

      <dialog id="editStaffDialog">
        <h3>Edit Staff</h3>
        <input type="hidden" id="editStaffId" />

        <div>
          <input type="text" id="editStaffName" placeholder="Full Name" />
          <span
            id="editStaffNameError"
            style="color: #ef4444; font-size: 12px; display: none"
          ></span>
        </div>

        <div>
          <input type="text" id="editStaffSpecialty" placeholder="Specialty" />
        </div>

        <div>
          <input type="text" id="editStaffPhone" placeholder="Phone" />
        </div>

        <div>
          <button type="button" id="saveEditStaffBtn">Save Changes</button>
          <button type="button" id="cancelStaffEditBtn">Cancel</button>
        </div>
      </dialog>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
